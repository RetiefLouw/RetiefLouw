<svg width="1200" height="150" viewBox="0 0 1200 150" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated orange signal</title>
  <desc id="desc">A restrained orange waveform with drifting particles on a dark background.</desc>
  <rect width="1200" height="150" rx="16" fill="#0D0E10"/>
  <path d="M0 78H210L242 78L266 47L297 106L324 78H462L490 78L521 25L560 126L601 78H1200" stroke="#2A2D30" stroke-width="2"/>
  <path d="M0 78H210L242 78L266 47L297 106L324 78H462L490 78L521 25L560 126L601 78H1200" stroke="#FF6A00" stroke-width="2" stroke-dasharray="12 18" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-120" dur="3s" repeatCount="indefinite"/>
  </path>
  <g fill="#FF6A00">
    <circle cx="242" cy="78" r="3"><animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="521" cy="25" r="3"><animate attributeName="r" values="3;7;3" dur="2.7s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#FF8A3D">
    <circle cx="780" cy="40" r="2"><animate attributeName="cy" values="40;62;40" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="108" r="2"><animate attributeName="cy" values="108;88;108" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="52" r="1.5"><animate attributeName="cx" values="1080;1110;1080" dur="4.8s" repeatCount="indefinite"/></circle>
  </g>
  <text x="34" y="37" fill="#747A80" font-family="Avenir Next, Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="2">A SMALL SIGNAL IN A LARGE SYSTEM</text>
</svg>
