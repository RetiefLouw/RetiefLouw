<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Retief Louw — I build</title>
  <desc id="desc">A dark minimalist animated hero with a straight orange pulse line, particles and modern sans-serif typography.</desc>
  <defs>
    <linearGradient id="orange" x1="150" y1="60" x2="1030" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#FF5A00"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#FF6A00" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FF6A00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FF6A00" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF8A3D" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FF6A00" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="330" rx="18" fill="#0D0E10"/>
  <circle cx="930" cy="100" r="230" fill="url(#glow)" opacity="0.75" filter="url(#blur)">
    <animate attributeName="cx" values="860;1100;820;860" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="100;205;62;100" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="210;290;185;210" dur="8s" repeatCount="indefinite"/>
  </circle>
  <rect x="-260" y="0" width="540" height="330" fill="url(#sweep)" opacity="0.18">
    <animate attributeName="x" values="-260;1220;-260" dur="9s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.2 1;0.45 0 0.2 1"/>
  </rect>
  <path d="M0 278C180 253 250 296 410 274C567 252 651 213 806 237C964 261 1026 300 1200 267" stroke="#242629" stroke-width="1"/>
  <path d="M0 58C150 83 236 42 393 63C526 81 659 112 811 72C953 35 1060 44 1200 72" stroke="#242629" stroke-width="1"/>

  <g opacity="0.9">
    <circle cx="1015" cy="95" r="3" fill="#FF6A00">
      <animate attributeName="cx" values="1015;1130;910;1015" dur="5.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="95;52;146;95" dur="5.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;1;0.45;0.35" dur="5.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1090" cy="202" r="2" fill="#FF8A3D">
      <animate attributeName="cx" values="1090;1018;1145;1090" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="202;248;178;202" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="944" cy="256" r="2" fill="#FF6A00">
      <animate attributeName="cx" values="944;885;1008;944" dur="4.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="256;218;274;256" dur="4.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1160" cy="116" r="1.5" fill="#FFB07A">
      <animate attributeName="cx" values="1160;1080;1174;1160" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="116;164;78;116" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g stroke="#FF6A00" stroke-opacity="0.28" stroke-width="1">
    <path d="M1015 95L1090 202L944 256L1015 95Z"/>
    <path d="M1090 202L1160 116"/>
  </g>

  <g transform="translate(74 60)" font-family="Avenir Next, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="0" y="0" fill="#FF8A3D" font-size="14" font-weight="600" letter-spacing="2.4">Retief Louw</text>
    <text x="0" y="104" fill="#F5F2ED" font-size="92" font-weight="700" letter-spacing="-3">I build</text>
    <text x="2" y="157" fill="#A9ADB2" font-size="22" font-weight="400" letter-spacing="0.3">software, intelligence and things that move.</text>
    <path d="M2 193H1106" stroke="url(#orange)" stroke-width="1.7" stroke-linecap="round" fill="none" stroke-dasharray="780 120 70 340 540 100 30 260 960 180 140 420 50 300">
      <animate attributeName="stroke-dashoffset" from="0" to="-4290" dur="7.2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="1.7;3.2;1.7;3.1;1.7;2.8;1.7;2.5;1.7" dur="0.72s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.06;0.12;0.18;0.24;0.42;0.62;0.8;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/>
      <animate attributeName="opacity" values="0.42;1;0.44;0.96;0.42;0.92;0.48;0.88;0.46" dur="0.72s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.06;0.12;0.18;0.24;0.42;0.62;0.8;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/>
    </path>
  </g>

</svg>

