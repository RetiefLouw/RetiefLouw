<svg width="1200" height="170" viewBox="0 0 1200 170" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated orange footer signal</title>
  <desc id="desc">A dark footer with a flowing orange line and drifting abstract particles.</desc>
  <defs>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FF5A00"/>
      <stop offset="0.45" stop-color="#FFB07A"/>
      <stop offset="1" stop-color="#FF6A00"/>
    </linearGradient>
    <radialGradient id="footerGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF6A00" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#FF6A00" stop-opacity="0"/>
    </radialGradient>
    <filter id="footerBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="170" rx="18" fill="#0D0E10"/>
  <circle cx="160" cy="86" r="120" fill="url(#footerGlow)" opacity="0.65" filter="url(#footerBlur)">
    <animate attributeName="cx" values="160;1030;160" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="86;58;86" dur="9s" repeatCount="indefinite"/>
  </circle>

  <path d="M0 96C120 96 140 96 196 96C243 96 258 43 302 43C350 43 355 132 410 132C464 132 470 96 520 96H1200" stroke="#282B2E" stroke-width="2"/>
  <path d="M0 96C120 96 140 96 196 96C243 96 258 43 302 43C350 43 355 132 410 132C464 132 470 96 520 96H1200" stroke="url(#trace)" stroke-width="2" stroke-dasharray="16 24" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="2.8s" repeatCount="indefinite"/>
  </path>

  <circle r="4" fill="#FFB07A">
    <animateMotion dur="5.5s" repeatCount="indefinite" path="M0 96C120 96 140 96 196 96C243 96 258 43 302 43C350 43 355 132 410 132C464 132 470 96 520 96H1200"/>
    <animate attributeName="r" values="3;6;3" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <g fill="#FF8A3D">
    <circle cx="774" cy="42" r="2">
      <animate attributeName="cy" values="42;66;42" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;1;0.35" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="940" cy="124" r="2">
      <animate attributeName="cx" values="940;1005;940" dur="5.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1090" cy="52" r="1.5">
      <animate attributeName="cy" values="52;84;52" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="36" y="36" fill="#A9ADB2" font-family="Avenir Next, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" letter-spacing="1.1">A quiet signal, still moving.</text>
</svg>
